<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ELO</title>
    <script type="text/javascript">
      // Redireciona para index.html preservando a rota acessada, para que o
      // roteamento client-side (React Router) funcione no GitHub Pages, que
      // não tem rewrites de servidor como a Vercel (vercel.json cuida disso
      // lá). Técnica: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // preserva o segmento "/projeto-elo"
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
